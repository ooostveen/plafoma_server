services:
  web:
    build: .
    ports:
      - "8090:80"
    environment:
      - PORT=80
      - MYSQLHOST=db
      - MYSQLPORT=3306
      - MYSQLDATABASE=unity_game_db
      - MYSQLUSER=root
      - MYSQLPASSWORD=secretpassword
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: unity_game_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8070:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=secretpassword
    depends_on:
      - db

volumes:
  mysql_data:
